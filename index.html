    <script>
      (function() {
        try {
          var currFetch = window.fetch;
          var makeAccessor = function() {
            return {
              get: function() { return currFetch; },
              set: function(val) { currFetch = val; },
              configurable: true,
              enumerable: true
            };
          };

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', makeAccessor());
            } catch (e) {}
          }

          try {
            Object.defineProperty(window, 'fetch', makeAccessor());
          } catch (e) {}

          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            try {
              Object.defineProperty(globalThis, 'fetch', makeAccessor());
            } catch (e) {}
          }
        } catch (e) {}

      })();
    </script>
